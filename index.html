<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anki2</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anki2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F3EC">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{--paper:#F6F3EC;--sheet:#FBF9F4;--white:#FFFFFF;--ink:#26221E;--sub:#6E665C;--rule:#DCD5C7;--shu:#B5432F;--shu-soft:#F6E3DE;--wave:#2F4F8A;--wave-soft:#E3E8F1;--ok:#3D7A55;--ok-soft:#E1EEE5;--mid:#9A6A1E;--mid-soft:#F5EBD3;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#16130F;--sheet:#1E1A15;--white:#221E18;--ink:#ECE6DB;--sub:#A79E91;--rule:#3A332A;--shu:#E0735F;--shu-soft:#3A221C;--wave:#8FA9DA;--wave-soft:#232B3A;--ok:#7DBB95;--ok-soft:#1F3127;--mid:#E2B456;--mid-soft:#3A2F17;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#16130F;--sheet:#1E1A15;--white:#221E18;--ink:#ECE6DB;--sub:#A79E91;--rule:#3A332A;--shu:#E0735F;--shu-soft:#3A221C;--wave:#8FA9DA;--wave-soft:#232B3A;--ok:#7DBB95;--ok-soft:#1F3127;--mid:#E2B456;--mid-soft:#3A2F17;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:1rem 1rem 5.5rem}
.head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:.45rem;margin-bottom:.8rem}
.head h1{margin:0;font-size:1.35rem;letter-spacing:.12em}.head small{color:var(--sub);font-size:.76rem}
.notice{background:var(--sheet);border-left:3px solid var(--shu);padding:.45rem .7rem;font-size:.8rem;margin:0 0 .9rem}
.crumb{display:flex;align-items:center;gap:.4rem;margin:0 0 .5rem;font-size:.8rem;color:var(--sub)}
.back{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.15rem .7rem;font-size:.8rem}
h2{font-size:1rem;letter-spacing:.14em;margin:1.2rem 0 .5rem;display:flex;align-items:baseline;gap:.5rem}h2 small{font-weight:400;letter-spacing:0;color:var(--sub);font-size:.74rem}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.tb{background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:.5rem .6rem}.tb .k{font-size:.66rem;color:var(--sub)}.tb .v{font-size:1.35rem;font-weight:700;line-height:1.2}.tb .v small{font-size:.7rem;font-weight:400;color:var(--sub)}
.cat{margin:1rem 0 .3rem;display:flex;align-items:baseline;gap:.5rem;border-bottom:1px solid var(--rule);padding-bottom:.2rem}.cat b{font-size:.95rem;letter-spacing:.14em}.cat small{color:var(--sub);font-size:.72rem}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.5rem;margin:.5rem 0}
.sub{text-align:left;border:1px solid var(--rule);border-left:5px solid var(--c);background:var(--white);border-radius:0 6px 6px 0;padding:.55rem .65rem;display:flex;flex-direction:column;gap:.2rem}
.sub b{font-size:1rem}.sub .ln{display:flex;gap:.6rem;font-size:.72rem;color:var(--sub);flex-wrap:wrap}.sub .ln em{font-style:normal;font-weight:700;color:var(--ink)}
.sub .ln .due em{color:var(--shu)}
.shead{border-left:6px solid var(--c);padding:.1rem 0 .2rem .7rem;margin:.2rem 0 .6rem}.shead h3{margin:0;font-size:1.25rem}.shead small{color:var(--sub);font-size:.76rem}
.tabs{display:flex;border-bottom:1px solid var(--rule);margin:0 0 .8rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.5rem .8rem .6rem;font-weight:700;color:var(--sub);white-space:nowrap;position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:.4rem;right:.4rem;bottom:-1px;height:3px;background:var(--shu)}
.tabs button span{font-size:.7rem;font-weight:400;color:var(--sub);margin-left:.2rem}
.card{background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:.65rem .75rem;margin:.5rem 0}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;padding:.45rem .95rem;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}.btn.shu{background:var(--shu);border-color:var(--shu);color:#fff}.btn.sm{padding:.22rem .6rem;font-size:.8rem}
.linkx{border:0;background:none;color:var(--wave);text-decoration:underline;padding:0;font-size:.82rem}
.note{font-size:.78rem;color:var(--sub)}
.deck{display:flex;align-items:center;gap:.6rem;border-top:1px dotted var(--rule);padding:.5rem 0}.deck:first-child{border-top:0}
.deck .nm{flex:1;min-width:0}.deck .nm b{display:block}.deck .nm small{font-size:.72rem;color:var(--sub)}
.num{font-variant-numeric:tabular-nums;font-size:.78rem;white-space:nowrap}.num .d{color:var(--shu);font-weight:700}.num .n{color:var(--wave);font-weight:700}
/* 解法の地図 */
.mapsec{margin:.6rem 0 1rem}
.msh{display:flex;align-items:baseline;gap:.5rem;margin:.2rem 0 .35rem}.msh b{font-size:.98rem}.msh small{color:var(--sub);font-size:.72rem}
.mgrp{border:1px solid var(--rule);border-radius:6px;background:var(--sheet);margin:.4rem 0;overflow:hidden}
.mgh{display:flex;align-items:center;gap:.5rem;padding:.4rem .65rem;background:var(--white);border-bottom:1px solid var(--rule)}
.mgh .kind{font-size:.62rem;font-weight:700;border-radius:3px;padding:0 .35rem}
.kind.k-意識{background:var(--wave-soft);color:var(--wave)}.kind.k-型{background:var(--shu-soft);color:var(--shu)}.kind.k-手順{background:var(--ok-soft);color:var(--ok)}
.mgh b{flex:1;font-size:.9rem}
.mi{display:grid;grid-template-columns:1fr auto;gap:.15rem .6rem;padding:.5rem .65rem;border-top:1px dotted var(--rule);align-items:start}.mi:first-of-type{border-top:0}
.mi .w{font-size:.76rem;color:var(--sub)}.mi .w b{color:var(--shu);font-weight:700}
.mi .t{font-size:.92rem;grid-column:1}
.mi .st{grid-row:1/span 2;grid-column:2;text-align:right;font-size:.66rem;color:var(--sub);white-space:nowrap}
.dots{display:inline-flex;gap:2px;margin-top:.15rem}.dots i{width:8px;height:8px;border-radius:2px;background:var(--rule)}.dots i.o{background:var(--ok)}.dots i.x{background:var(--shu)}
.mi.new{background:var(--mid-soft)}.mi .newb{font-size:.6rem;font-weight:700;color:var(--mid);margin-left:.3rem}
.addmi{display:grid;grid-template-columns:1fr;gap:.3rem;padding:.5rem .65rem;border-top:1px dashed var(--rule)}
.addmi input,.addmi textarea,.f input,.f textarea,.f select{width:100%;padding:.4rem .5rem;border:1px solid var(--rule);border-radius:3px;background:var(--white)}
/* 材料 */
.mat{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--white);border-radius:6px;padding:.55rem .7rem;margin:.45rem 0}
.mat .top{display:flex;align-items:baseline;gap:.5rem}.mat .top b{flex:1}.mat .top small{color:var(--sub);font-size:.72rem}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin:.35rem 0 .2rem;display:flex}.bar i{display:block;height:100%}
.legend{display:flex;gap:.7rem;font-size:.7rem;color:var(--sub);flex-wrap:wrap}.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:.25rem;vertical-align:-1px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:4px;margin:.5rem 0}
.q{border:1px solid var(--rule);background:var(--white);border-radius:4px;padding:.2rem 0;text-align:center;font-size:.76rem;font-variant-numeric:tabular-nums}
.q.s-○{background:var(--ok);border-color:var(--ok);color:#fff}.q.s-△{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}.q.s-×{background:var(--shu-soft);border-color:var(--shu);color:var(--shu)}.q.next{box-shadow:0 0 0 2px var(--wave)}
/* 演習 */
.ex-top{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;border:2px solid var(--ink);border-radius:8px;padding:.6rem .75rem;background:var(--white)}
.ex-top b{font-size:1.05rem}.timer{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:.55rem;align-items:flex-start;padding:.45rem .2rem;border-top:1px dotted var(--rule)}.chk:first-child{border-top:0}
.chk .t{flex:1;font-size:.9rem}.chk .t small{display:block;font-size:.72rem;color:var(--sub)}
.seg3{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;flex:none}.seg3 button{border:0;background:var(--white);padding:.25rem .45rem;font-size:.72rem;color:var(--sub);border-left:1px solid var(--rule)}.seg3 button:first-child{border-left:0}
.seg3 button[aria-pressed="true"].o{background:var(--ok);color:#fff}.seg3 button[aria-pressed="true"].x{background:var(--shu);color:#fff}.seg3 button[aria-pressed="true"].n{background:var(--rule);color:var(--ink)}
.result{background:var(--ok-soft);border:1px solid var(--ok);border-radius:6px;padding:.6rem .75rem;margin:.6rem 0}
.bot{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bot button{flex:1;max-width:180px;border:0;background:none;padding:.6rem 0 .7rem;font-weight:700;color:var(--sub);position:relative}
.bot button[aria-selected="true"]{color:var(--ink)}.bot button[aria-selected="true"]::before{content:"";position:absolute;left:20%;right:20%;top:0;height:3px;background:var(--shu)}
.toast{position:fixed;left:50%;bottom:4.2rem;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.45rem .9rem;border-radius:4px;font-size:.84rem;z-index:20}

.ctabs{display:flex;gap:.3rem;margin:0 0 .7rem;overflow-x:auto}
.ctabs button{border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:.3rem .9rem;font-weight:700;font-size:.86rem;color:var(--sub);white-space:nowrap}
.ctabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ctabs.sm button{font-size:.78rem;padding:.2rem .7rem}
.kseg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:0 0 .6rem}
.kseg button{flex:1;border:0;border-left:1px solid var(--rule);background:var(--white);padding:.45rem .3rem;font-size:.82rem;font-weight:700;color:var(--sub)}.kseg button:first-child{border-left:0}
.kseg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 -3px 0 var(--shu)}.kseg button small{display:block;font-weight:400;font-size:.66rem}
.sblock{border:1px solid var(--rule);border-left:5px solid var(--c);background:var(--white);border-radius:0 6px 6px 0;padding:.5rem .7rem;margin:.5rem 0}
.sblock .sh{display:flex;align-items:baseline;gap:.5rem}.sblock .sh b{font-size:1rem;flex:1}
.hist{border-left:3px solid var(--rule);padding:.25rem 0 .25rem .65rem;margin:.4rem 0;font-size:.86rem}
.hist.g-○{border-left-color:var(--ok)}.hist.g-△{border-left-color:var(--mid)}.hist.g-×{border-left-color:var(--shu)}
.hist small{display:block;color:var(--sub);font-size:.7rem}
.sheetbg{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--paper);z-index:21;border-top:2px solid var(--ink);border-radius:10px 10px 0 0;padding:1rem 1rem calc(1.3rem + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.sheet h3{margin:.1rem 0 .4rem}.close{float:right;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:.15rem .7rem;font-size:.84rem}
.f{margin:.4rem 0}.f label{display:block;font-size:.72rem;color:var(--sub);margin-bottom:.15rem}
.loose{display:flex;align-items:center;gap:.5rem;border-top:1px dotted var(--rule);padding:.45rem 0}.loose:first-child{border-top:0}.loose .nm{flex:1;min-width:0}.loose .nm small{display:block;font-size:.7rem;color:var(--sub)}
.gb{display:inline-block;min-width:1.6rem;text-align:center;border-radius:3px;font-weight:700;font-size:.78rem;padding:0 .3rem}.gb.g-○{background:var(--ok);color:#fff}.gb.g-△{background:var(--mid-soft);color:var(--mid)}.gb.g-×{background:var(--shu-soft);color:var(--shu)}.gb.g-{border:1px solid var(--rule);color:var(--sub)}
.bsearch{display:flex;gap:.4rem;margin:0 0 .5rem}.bsearch input{flex:1;padding:.45rem .6rem;border:1px solid var(--rule);border-radius:999px;background:var(--white)}
.bfil{display:flex;gap:.35rem;flex-wrap:wrap;margin:0 0 .5rem}.bfil select{padding:.25rem .4rem;border:1px solid var(--rule);border-radius:4px;background:var(--white);font-size:.8rem}
.btable{border:1px solid var(--rule);border-radius:6px;background:var(--white);overflow:hidden}
.brow{display:grid;grid-template-columns:1fr auto;gap:.1rem .6rem;padding:.45rem .65rem;border-top:1px dotted var(--rule);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;background:none}.brow:first-child{border-top:0}
.brow b{font-size:.92rem;font-weight:700}.brow .meta{font-size:.7rem;color:var(--sub)}.brow .due{font-size:.72rem;text-align:right;color:var(--sub);white-space:nowrap}
.brow .stt{font-size:.62rem;font-weight:700;border-radius:3px;padding:0 .3rem;margin-left:.3rem}.stt.s-新規{background:var(--wave-soft);color:var(--wave)}.stt.s-復習中{background:var(--mid-soft);color:var(--mid)}.stt.s-習熟{background:var(--ok-soft);color:var(--ok)}
.pkv{display:grid;grid-template-columns:5.5rem 1fr;gap:.2rem .7rem;padding:.4rem 0;border-top:1px dotted var(--rule)}.pkv .k{font-size:.68rem;color:var(--sub)}.pkv .v{font-size:.9rem}
.btn:disabled{opacity:.4}

/* 見本3 */
.hdbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:.1rem .55rem;font-size:.8rem;margin-left:.5rem}
.bot button{max-width:140px;font-size:.86rem}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mitools{display:flex;gap:.7rem;align-items:center;margin-top:.15rem;font-size:.72rem}.mitools .linkx{font-size:.72rem}
.figb{font-size:.6rem;font-weight:700;border:1px solid var(--wave);color:var(--wave);border-radius:3px;padding:0 .3rem}
.figs{display:flex;flex-direction:column;gap:.4rem;margin:.4rem 0 .1rem}.figs img{max-width:100%;border:1px solid var(--rule);border-radius:4px;background:#fff}
.figs pre.mermaid{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:.5rem;margin:0;overflow:auto;font-size:.8rem;white-space:pre}
.mgtools{display:flex;justify-content:flex-end;gap:.8rem;margin:-.2rem 0 .35rem}
/* 復習 */
.rvtop{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--sub);margin:0 0 .5rem}.rvtop b{color:var(--ink)}.rvtop .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.rvtop .cnt .n{color:var(--wave);font-weight:700}.rvtop .cnt .l{color:var(--shu);font-weight:700}.rvtop .cnt .r{color:var(--ok);font-weight:700}
.cardbox{background:var(--white);border:1px solid var(--rule);border-radius:8px;min-height:46vh;padding:1rem;font-size:1.15rem;text-align:center;position:relative}
.cardbox hr{border:0;border-top:1px solid var(--rule);margin:1rem 0}
mjx-container{color:var(--ink)}mjx-container[display="true"]{margin:.7em 0!important;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:.15em 0}
mjx-container:not([display]) svg{vertical-align:-.25ex}.cardbox .cloze{color:var(--wave);font-weight:700}
.cardbox iframe{width:100%;border:0;min-height:40vh;display:block}
.cardbox .flagbar{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:8px 0 0 8px}
.cardbox .markst{position:absolute;right:.5rem;top:.4rem;font-size:1rem;color:var(--mid)}
.ansbar{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.7rem 0 .4rem}
.ans{border:1px solid var(--rule);background:var(--white);border-radius:6px;padding:.45rem .2rem .55rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:.05rem}
.ans small{font-weight:400;font-size:.7rem;color:var(--sub)}.ans.a1{color:var(--shu)}.ans.a2{color:var(--mid)}.ans.a3{color:var(--ok)}.ans.a4{color:var(--wave)}
.showans{width:100%;margin:.7rem 0 .4rem;padding:.75rem;font-size:1rem}
.rvtools{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center;font-size:.78rem;margin-top:.3rem}
.fl{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15)}
/* デッキ */
.dtree .deck{padding-left:calc(var(--lv,0) * 1.1rem)}.dtree .deck .tg{border:0;background:none;width:1.2rem;padding:0;color:var(--sub);font-size:.8rem}
.gear{border:1px solid var(--rule);background:var(--white);border-radius:4px;width:2rem;height:1.9rem;padding:0;font-size:.9rem}
/* 統計 */
.chart{background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:.55rem .65rem .4rem;margin:.5rem 0}
.chart h4{margin:0 0 .3rem;font-size:.88rem}.chart h4 small{font-weight:400;color:var(--sub);font-size:.72rem;margin-left:.4rem}
.chart svg{width:100%;height:auto;display:block}.chart .lg{display:flex;gap:.8rem;font-size:.7rem;color:var(--sub);flex-wrap:wrap;margin-top:.2rem}
.chart .lg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:.25rem;vertical-align:-1px;background:var(--c)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}.kpis div{background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:.4rem .5rem}.kpis small{display:block;font-size:.64rem;color:var(--sub)}.kpis b{font-size:1.1rem}
/* ブラウザ */
.brow{grid-template-columns:auto 1fr auto}.brow input[type=checkbox]{margin:.2rem .2rem 0 0}
.bact{position:sticky;top:0;z-index:3;background:var(--paper);display:flex;gap:.35rem;flex-wrap:wrap;padding:.3rem 0;margin:0 0 .3rem;border-bottom:1px solid var(--rule)}
.bsort{display:flex;gap:.4rem;align-items:center;font-size:.76rem;color:var(--sub);margin:0 0 .4rem}
.syn{font-size:.72rem;color:var(--sub);margin:-.2rem 0 .45rem}.syn code{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:0 .25rem;font-size:.7rem}
/* 作る */
.fld textarea{width:100%;min-height:2.6rem;padding:.4rem .5rem;border:1px solid var(--rule);border-radius:3px;background:var(--white);line-height:1.5}
.fbtns{display:flex;gap:.3rem;margin:.15rem 0 0}.fbtns button{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;font-size:.72rem;padding:.05rem .45rem}
.prev2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}.prev2 .cardbox{min-height:5rem;font-size:.95rem}
.codeta{width:100%;min-height:8rem;font-family:ui-monospace,Menlo,monospace;font-size:.74rem;padding:.4rem;border:1px solid var(--rule);border-radius:3px;background:var(--white)}
.mlist{border:1px solid var(--rule);border-radius:6px;background:var(--white)}.mlist button{display:flex;width:100%;text-align:left;border:0;border-top:1px dotted var(--rule);background:none;padding:.55rem .7rem;gap:.5rem;align-items:baseline}.mlist button:first-child{border-top:0}.mlist button small{margin-left:auto;color:var(--sub);font-size:.72rem}

/* 見本5 */
.rvtools2{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.5rem}

<body>

<script>
/* ── core.js ── */
/* Anki2 core — 保存(IndexedDB)・Ankiの書き出しの読み込み・カードの描き方・FSRS
   ここは画面を持たない。app.js から使う。 */
"use strict";
const A2 = {};
/* ───── 日付(1日の切り替わりは午前4時) ───── */
A2.ROLL = 4;
A2.dayOf = ms => { const d = new Date(ms - A2.ROLL * 3600e3); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60e3) / 86400e3); };
A2.today = () => A2.dayOf(Date.now());
A2.dayStr = day => { const d = new Date(day * 86400e3); return (d.getUTCMonth() + 1) + "/" + d.getUTCDate(); };
A2.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ───── 保存(IndexedDB)。起動時に全部を読み、変えたものだけ書く ───── */
const STORES = ["notes", "cards", "revlog", "notetypes", "decks", "media", "meta", "subjects", "exsub", "backups", "trash", "stages", "memos", "wh"];   // trash:ごみ箱(30日)   // exsub:分野ごとの演習(材料・地図・結果)
A2.db = null;
A2.open = () => new Promise((res, rej) => { const r = indexedDB.open("anki2", 7);   // 7:デッキの倉庫   // 6:デッキのメモ   // 5:段階の型   // 4:ごみ箱   // 3:自動の控えの置き場所   // 2:演習の保存場所を足した
  r.onupgradeneeded = () => { const db = r.result; STORES.forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: n === "media" ? "name" : n === "meta" ? "k" : "id" }); }); };
  r.onblocked = () => rej(new Error("ほかのタブで古い版の Anki2 が開いている。そちらを閉じてから開き直してください"));
  r.onsuccess = () => { A2.db = r.result; res(A2.db); }; r.onerror = () => rej(r.error); });
A2.all = store => new Promise((res, rej) => { const q = A2.db.transaction(store).objectStore(store).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); });
A2.put = (store, items) => new Promise((res, rej) => { if (!items.length) return res(); const tx = A2.db.transaction(store, "readwrite"), os = tx.objectStore(store); items.forEach(x => os.put(x)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
A2.del = (store, keys) => new Promise((res, rej) => { if (!keys.length) return res(); const tx = A2.db.transaction(store, "readwrite"), os = tx.objectStore(store); keys.forEach(k => os.delete(k)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
A2.getOne = (store, key) => new Promise((res, rej) => { const q = A2.db.transaction(store).objectStore(store).get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); });
/* 記憶の中の写し(画面はこれを読む) */
A2.S = { notes: new Map(), cards: new Map(), revlog: new Map(), notetypes: new Map(), decks: new Map(), subjects: new Map(), exsub: new Map(), stages: new Map(), memos: new Map(), wh: new Map(), meta: {} };

  if (t.dataset && t.dataset.dupk && V.sheet && V.sheet.k === "nt") { const nt = A2.S.notetypes.get(V.sheet.id), set = new Set(A2.dupKeys(nt)); t.checked ? set.add(t.dataset.dupk) : set.delete(t.dataset.dupk); nt.dupKeys = nt.fields.filter(f => set.has(f)); if (!nt.dupKeys.length) nt.dupKeys = [nt.fields[0]]; await A2.save("notetypes", [nt]); render(); }
  if (t.dataset && t.dataset.calcf && V.sheet && V.sheet.k === "nt") { const nt = A2.S.notetypes.get(V.sheet.id); nt.calc = Object.assign({}, nt.calc || {}, { [t.dataset.calcf]: t.value }); await A2.save("notetypes", [nt]); toast("保存した"); render(); }

function logErr(m){ try { const L = (A2.S.meta.errors || []).concat({ t: Date.now(), m: String(m).slice(0, 500), v: APP_VERSION }).slice(-30); A2.S.meta.errors = L; A2.S.meta.lastErr = String(m).slice(0, 160); if (A2.db) A2.put("meta", [{ k: "errors", v: L }]); const eb = $("errbar"); if (eb) eb.remove(); afterRenderErr(); } catch (e) {} }

  /* 開いたときの点検は、知らせるだけで、何も変えない(同期の途中だと、届く途中のカードを消してしまうため) */
  setTimeout(async () => { try { const h = await A2.healFromRecords(); if (h) toast("復習の記録と食い違っていた " + h + "枚を、記録どおりに直した"); } catch (e) { logErr(e.message); } }, 1500);

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {}); }
/* 全部のファイルを読み終えてから始める(版がそろっているかを確かめるため) */
let booted = false; const boot1 = () => { if (!booted) { booted = true; boot(); } };
if (document.readyState === "complete") boot1(); else { document.addEventListener("DOMContentLoaded", boot1); window.addEventListener("load", boot1); }

<script>
/* ── exercise.js ── */
/* Anki2 演習 — 材料(問題集・ばらの問題)・解法の地図・結果・画面いっぱいの演習。データは分野ごとに A2.S.exsub */
"use strict";

const EXK = [ ["常に", "常に意識", "読んでいるあいだ、ずっと意識すること"], ["もし", "もし〜なら", "何かに出会ったら、こうする"], ["型", "問題の型", "この型の問題が出たら、こう解く"], ["手順", "手順", "この順番で進める"] ];

const exDoc = sid => A2.S.exsub.get(sid) || { id: sid, mats: [], loose: [], map: [], hist: [] };
const exSave = doc => A2.save("exsub", [doc]);
const exSubj = () => A2.S.subjects.get(EXV.sub);
const exMat = (doc, mid) => mid === "loose" ? { id: "loose", name: "ばらの問題", items: doc.loose, area: null } : doc.mats.find(m => m.id === mid);
const exStat = items => ({ o: items.filter(x => x.s === "○").length, t: items.filter(x => x.s === "△").length, x: items.filter(x => x.s === "×").length, all: items.length });

const exAreas = doc => [...new Set(doc.map.map(x => x.area).concat(doc.areas || []))];
const exNode = (doc, id, path) => { let n = doc.map.find(x => x.id === id); (path || []).forEach(i => { n = n && (n.kids || [])[i]; }); return n; };
const exCount = n => (n.kids || []).reduce((a, k) => a + 1 + exCount(k), 0);
const exDots = r => '<span class="dots">' + String(r || "").slice(-8).split("").map(c => `<i class="${c === "o" ? "o" : "x"}"></i>`).join("") + "</span>";
/* ───── 一覧 ───── */
function exHome(){ const subs = [...A2.S.subjects.values()].filter(s => s.cat === V.cat).sort((a, b) => a.name.localeCompare(b.name, "ja"));
  return catTabs() + (subs.map(s => { const d = exDoc(s.id), last = d.hist[0]; return `<button class="mat" data-xsub="${s.id}" style="border-left:5px solid ${s.c};border-radius:0 6px 6px 0"><div class="top"><b>${esc(s.name)}</b><small>${d.mats.length ? "材料 " + d.mats.length : ""}${d.loose.length ? "・ばら " + d.loose.length : ""}${d.map.length ? "・地図 " + d.map.length : ""}</small></div><div class="note">${last ? "最後の演習:" + A2.dayStr(A2.dayOf(last.t)) + " " + esc(last.qn) + ` <span class="gb g-${last.g}">${last.g}</span>` : "まだ演習していない"}</div></button>`; }).join("") || '<p class="note">この分類には、まだ分野がない。暗記の「+ 分野」で作ると、ここにも出る。</p>'); }

  if (EXV.tab === "材料") body = (doc.mats.map(m => { const st = exStat(m.items), nx = exNext(m); return `<button class="mat" data-xmat="${m.id}"><div class="top"><b>${esc(m.name)}</b><small>${esc(m.kind || "")}</small></div><div class="bar"><i style="width:${st.all ? st.o / st.all * 100 : 0}%;background:var(--ok)"></i><i style="width:${st.all ? st.t / st.all * 100 : 0}%;background:var(--mid)"></i><i style="width:${st.all ? st.x / st.all * 100 : 0}%;background:var(--shu)"></i></div><div class="legend"><span style="--c:var(--ok)">○ ${st.o}</span><span style="--c:var(--mid)">△ ${st.t}</span><span style="--c:var(--shu)">× ${st.x}</span><span style="--c:var(--rule)">まだ ${st.all - st.o - st.t - st.x}</span>${nx ? `<span style="--c:var(--wave)">次:${esc(nx.n)}</span>` : ""}</div></button>`; }).join("") || '<p class="note">問題集はまだない。</p>') +
    `<button class="madd" data-xmatnew>+ 問題集を足す</button><h2>ばらの問題<small>問題集に入っていない1問ずつ</small></h2><div class="card">${doc.loose.map(q => `<div class="loose"><span class="gb g-${q.s}">${q.s || "まだ"}</span><div class="nm">${esc(q.n)}<small>${esc(q.src || "")}${q.area ? (q.src ? "・" : "") + "地図「" + esc(q.area) + "」" : ""}</small></div><button class="btn ghost sm" data-xq="loose|${q.id}">開く</button></div>`).join("") || '<p class="note" style="margin:0">まだない。</p>'}</div><button class="madd" data-xloosenew>+ 問題を1つ足す</button>`;
  if (EXV.tab === "解法の地図") { const areas = exAreas(doc); if (!EXV.area || !areas.includes(EXV.area)) EXV.area = areas[0];
    const its = doc.map.filter(x => x.area === EXV.area && x.kind === EXV.kind), k = EXK.find(x => x[0] === EXV.kind), allOpen = its.length && its.every(x => EXV.mopen[x.id]);
    body = `<nav class="marea">${areas.map(a => `<button data-xarea="${esc(a)}" aria-pressed="${EXV.area === a}">${esc(a)}<small>${doc.map.filter(x => x.area === a).length}</small></button>`).join("")}<button data-xareanew style="color:var(--wave)">+ 領域</button></nav>
      ${!areas.length ? '<p class="note">まず「+ 領域」で、地図の領域(例:長文読解・英作文)を作る。AIに作ってもらってもよい。</p><button class="btn sm shu" data-xai>AIに作ってもらう</button>' : `<div class="mkind">${EXK.map(([kk, t]) => `<button data-xkind="${kk}" aria-pressed="${EXV.kind === kk}">${t}<small>${doc.map.filter(x => x.area === EXV.area && x.kind === kk).length}</small></button>`).join("")}</div>

      <div class="mapl k-${EXV.kind}">${its.map(exItem).join("") || '<p class="note" style="padding:.6rem 0">まだない。下の「+ 書き足す」から。</p>'}</div>
      <div class="row" style="margin:.6rem 0 0;gap:.6rem"><button class="btn sm shu" data-xai>AIに作ってもらう</button><button class="btn ghost sm" data-xmapcopy>この領域の地図をコピー</button></div>
      ${EXV.adding ? `<div class="maddf"><input id="xadd-h" placeholder="${{ 常に: "見出し(例:時間を見る)", もし: "〜が出たら(例:知らない単語が出たら)", 型: "型の名前(例:要約問題)", 手順: "手順の名前" }[EXV.kind]}"><textarea id="xadd-t" rows="2" placeholder="${{ 常に: "どう意識するか", もし: "こうする", 型: "こう解く", 手順: "ひとことで(段は、あとで「⋯」から足す)" }[EXV.kind]}"></textarea><div class="row"><button class="btn sm" data-xaddsave>書き足す</button><button class="linkx" data-xaddcancel>やめる</button></div></div>` : `<button class="madd" data-xaddopen>+ 書き足す</button>`}`}`; }
  if (EXV.tab === "結果") body = doc.hist.length ? doc.hist.map(h => exHistRow(h, true)).join("") : '<p class="note">まだ演習していない。</p>';
  return `<div class="crumb"><button class="back" data-xhome>‹ 演習</button>${esc((CATS.find(c => c.id === s.cat) || {}).name || "")}</div><div class="shead" style="--c:${s.c}"><h3>${esc(s.name)}</h3><small>演習</small></div>
    <div class="tabs">${[["材料", doc.mats.length + doc.loose.length], ["解法の地図", doc.map.length], ["結果", doc.hist.length]].map(([t, n]) => `<button data-xtab="${t}" aria-selected="${EXV.tab === t}">${t}${n ? `<span>${n}</span>` : ""}</button>`).join("")}</div>${body}`; }
function exHistRow(h, withName){ const ok = Object.values(h.marks || {}).filter(v => v === "o").length, ng = Object.values(h.marks || {}).filter(v => v === "x").length;
  return `<button class="hist g-${h.g}" data-xhist="${h.id}" style="display:block;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0;background:none"><small>${A2.dayStr(A2.dayOf(h.t))}・${exTm(h.sec)}${ok + ng ? "・意識 できた" + ok + " 忘れた" + ng : ""}</small><span class="gb g-${h.g}">${h.g}</span> ${withName ? esc(h.qn) : ""}${h.note ? `<div class="note">${esc(h.note)}</div>` : ""}</button>`; }
function exMaterial(){ const s = exSubj(), doc = exDoc(s.id), m = exMat(doc, EXV.mat), st = exStat(m.items), nx = exNext(m);
  return `<div class="crumb"><button class="back" data-xbacksub>‹ ${esc(s.name)}</button>演習の材料</div><div class="shead" style="--c:${s.c}"><h3>${esc(m.name)}</h3><small>${esc(m.kind || "")}・全${st.all}${m.area ? "・解法の地図「" + esc(m.area) + "」" : ""}</small></div>
    <div class="legend"><span style="--c:var(--ok)">○ できた ${st.o}</span><span style="--c:var(--mid)">△ あやしい ${st.t}</span><span style="--c:var(--shu)">× できなかった ${st.x}</span><span style="--c:var(--rule)">まだ ${st.all - st.o - st.t - st.x}</span></div>
    <div class="grid">${m.items.map(x => `<button class="q${x.s ? " s-" + x.s : ""}${nx === x ? " next" : ""}" data-xq="${m.id}|${x.id}">${esc(x.n)}</button>`).join("")}</div>
    <div class="row">${nx ? `<button class="btn shu" data-xstart="${m.id}|${nx.id}">次の ${esc(nx.n)} で演習する</button>` : ""}<button class="linkx" data-xmatedit="${m.id}">この問題集を直す</button></div><p class="note">問題の番号を押すと、その問題のこれまでの演習が見られる。</p>`; }
/* ───── 地図の項目(形ごと) ───── */
const exHasDet = it => !!(it.detail || (it.figs || []).length);
function exFigs(it){ return (it.figs || []).length ? `<div class="figs">${it.figs.map(f => f.type === "img" ? `<img src="${f.src}" alt="図">` : `<pre class="mermaid">${esc(f.code)}</pre>`).join("")}</div>` : ""; }

    const first = !conn(); await A2.setMeta("conn", c); if (first) { for (const st of STORES_SYNC) A2.markPending(st, [...A2.S[st].keys()]); const ms = await A2.all("media"); await A2.setMeta("mediaUp", ms.map(m => m.name)); }
    toast("つないだ。同期する"); render(); syncNow(); return; }
  if (b.hasAttribute("data-syncnow")) { SYNC.wantFull = true; SYNC.manual = true; syncNow().then(() => render()); return; }
  if (b.hasAttribute("data-syncundo")) { const P = A2.S.meta.lastPrev; if (!P || !P.items.length) return; if (!confirm(P.items.length + "件を、直前の同期の前に戻す?")) return;
    const by = {}; P.items.forEach(x => (by[x.st] = by[x.st] || []).push(Object.assign({}, x.rec))); for (const [st, recs] of Object.entries(by)) await A2.save(st, recs); A2.S.meta.lastPrev = null; await A2.setMeta("lastPrev", null); toast("直前の同期を取り消した"); render(); syncNow(); return; }
  if (b.hasAttribute("data-heldopen")) { V.sheet = { k: "held" }; render(); return; }
  if (b.hasAttribute("data-heldyes") || b.hasAttribute("data-heldno")) { const yes = b.hasAttribute("data-heldyes"), key = b.dataset.heldyes || b.dataset.heldno, M = A2.S.meta, list = (M.held || []).filter(h => heldKey(h) === key);
    for (const h of list) { if (h.kind === "del") { if (yes) await A2.remove(h.st, [h.id], { fromSync: true, why: "ほかの端末で消された(確かめて消した)" }); else { const x = A2.S[h.st].get(h.id); if (x) await A2.save(h.st, [Object.assign({}, x)]); } }
      else if (h.kind === "empty") { if (yes) await A2.save(h.st, [h.rec], { keepMod: true, fromSync: true }); else { const x = A2.S[h.st].get(h.id); if (x) await A2.save(h.st, [Object.assign({}, x)]); } } }
    M.held = (M.held || []).filter(h => heldKey(h) !== key); await A2.setMeta("held", M.held); toast(yes ? "当てはめた" : "この端末のものを残した(ほかの端末にも戻る)"); render(); syncNow(); return; }
  /* この端末と置き場所を、1件ずつ見比べる(どちらにだけあるか) */
  if (b.hasAttribute("data-synccmp")) { const out = $("synccmp"); if (out) out.textContent = "見比べている…"; try { const c = conn(), rs = await remoteState(c), last = {};
      const see = (st, id, mod, gone) => { const m = last[st] = last[st] || new Map(), o = m.get(id); if (!o || (mod || 0) >= o.mod) m.set(id, { mod: mod || 0, gone }); };
      for (const [p, sha] of Object.entries(rs.files)) { const o = await readBlob(c, sha);
        if (p.startsWith("changes/")) { Object.entries(o.recs || {}).forEach(([st, list]) => list.forEach(r => see(st, r.id, r.mod, false))); Object.entries(o.del || {}).forEach(([st, m]) => Object.entries(m).forEach(([id, dv]) => { if (dv && typeof dv === "object") see(st, id, +dv.m, true); })); }
        else { const st = storeOfShard(p.replace(/\.json$/, "")); (o.recs || []).forEach(r => see(st, r.id, r.mod, false)); Object.entries(o.del || {}).forEach(([id, dv]) => { if (dv && typeof dv === "object") see(st, id, +dv.m, true); }); } }
      const rows = [["notes", "ノート"], ["cards", "カード"], ["revlog", "復習の記録"], ["decks", "デッキ"], ["notetypes", "ノートタイプ"]].map(([st, l]) => { const r = new Set([...(last[st] || new Map())].filter(([, v]) => !v.gone).map(([id]) => id)), loc = A2.S[st], onlyR = [...r].filter(id => !loc.has(id)).length, onlyL = [...loc.keys()].filter(id => !r.has(id)).length;
        return "<b>" + l + "</b>:この端末 " + loc.size + "・置き場所 " + r.size + (onlyR ? "・<b style='color:var(--shu)'>置き場所にだけある " + onlyR + "</b>" : "") + (onlyL ? "・<b style='color:var(--shu)'>この端末にだけある " + onlyL + "</b>" : ""); });
      if (out) out.innerHTML = rows.join("<br>") + "<br>未送信 " + A2.pendingCount() + (SYNC.err ? "・前の同期のエラー:" + esc(SYNC.err) : "") + "・版 " + esc(window.APP_VER_SYNC) + "<br>食い違いがあれば、両方の端末で「同期をやり直す」を1回ずつ押す。"; } catch (e) { if (out) out.textContent = "見比べられなかった:" + e.message; } return; }
  if (b.hasAttribute("data-syncfull")) { if (SYNC.busy) { toast("同期中。終わってからもう一度押してください"); render(); return; }
    const M = A2.S.meta, before = { n: A2.S.cards.size + A2.S.notes.size + A2.S.revlog.size };
    M.baseSha = {}; M.applied = {}; M.lastHead = null; let sent = 0; for (const st of STORES_SYNC) { A2.markPending(st, [...A2.S[st].keys()]); sent += A2.S[st].size; }
    await A2.setMeta("baseSha", {}); await A2.setMeta("applied", {}); await A2.setMeta("lastHead", null); toast("やり直している…"); render();
    const got = await syncNow(); SYNC.full = { got: got || 0, sent: SYNC.err ? 0 : sent }; toast(SYNC.err ? "やり直せなかった:" + SYNC.err : "やり直した(受け取った " + (got || 0) + "件)"); render(); return; }
  if (b.hasAttribute("data-syncoff")) { if (!confirm("この端末の同期をやめる?(データはこの端末に残る)")) return; await A2.setMeta("conn", null); render(); return; } });
/* 保留:種類とデッキ(またはノートタイプ)ごとにまとめる */
function heldKey(h){ if (h.kind === "del" && h.st === "cards") { const c = A2.S.cards.get(h.id); return "del|cards|" + (c ? c.deck : ""); } if (h.kind === "del") return "del|" + h.st; return "empty|" + h.st; }
function heldSheet(){ const g = new Map(); (A2.S.meta.held || []).forEach(h => { const k = heldKey(h); (g.get(k) || g.set(k, []).get(k)).push(h); });
  const lab = k => { const [kind, st, deck] = k.split("|"); if (kind === "empty") return "欄が空になる変更(ノート)"; const nm = { cards: "カード", notes: "ノート", decks: "デッキ", notetypes: "ノートタイプ", subjects: "分野", exsub: "演習", revlog: "復習の記録" }[st] || st; return "ほかの端末で消された" + nm + (deck ? "(" + ((A2.S.decks.get(deck) || {}).name || "") + ")" : ""); };
  return `<h3>保留中の変更</h3><p class="note" style="margin-top:0">ほかの端末で起きた「減る変更」。押すまで、この端末では何も消えない。</p>${[...g.entries()].map(([k, hs]) => `<div class="pkv"><span class="k">${esc(lab(k))}</span><span class="v">${hs.length}件<br><button class="btn sm" data-heldyes="${esc(k)}">この端末でも当てはめる</button> <button class="btn ghost sm" data-heldno="${esc(k)}">残す</button></span></div>`).join("") || '<p class="note">保留中のものはない。</p>'}`; }
window.heldSheet = heldSheet;
window.syncNow = syncNow; window.syncBadge = syncBadge; window.syncSheet = syncSheet; window.SYNC = SYNC;
setTimeout(() => { if (conn()) syncNow(); }, 1500);

</script>
